<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cénit Mental</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-titles">
            <h1>Cénit Mental</h1>
            <p>Liberación y Crecimiento</p>
        </div>
    </header>

    <!-- Contenedor del Post del Día (Se llena con JS) -->
    <section class="featured-post" id="featured-container"></section>

    <!-- Contenedor del Grid de Entradas Anteriores (Se llena con JS) -->
    <main class="grid-container" id="grid-container"></main>

    <footer>
        <div class="footer-logo">
            <img src="https://i.postimg.cc/JnhvtBCF/logo-jv.png" alt="Joaquin Vazquez Logo" class="footer-img">
        </div>
        <p>&copy; 2026 Cénit Mental. Reflexiones personales inspiradas en literatura y filosofías de vida.</p>
        <p class="credits">Desarrollado por Joaquín Vázquez</p>
    </footer>

    <!-- Carga de datos y script de automatización -->
    <script src="datos.js"></script>
    <script src="app.js"></script>
</body>
</html>
