<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reflexiones personales sobre filosofía de vida, crecimiento y libertad.">
    <title>Cénit Mental - Reflexión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Barra de progreso de lectura fija arriba -->
    <div class="progress-container">
        <div id="progress-indicator" class="progress-indicator"></div>
    </div>

    <main class="container">
        <article class="article-detail">
            <h1 id="title"></h1>
            <div class="article-meta">
                <span id="reading-time" class="reading-time" hidden></span>
            </div>
            <img id="image" src="" alt="" class="detail-img">
            <p id="quote" class="quote"></p>
            <p id="author" class="author"></p>
            <hr>

            <div class="reader-toolbar" aria-label="Herramientas de lectura">
                <span class="reader-toolbar-label">Tamaño de lectura</span>
                <div class="font-size-controls" role="group" aria-label="Ajustar tamaño de texto">
                    <button
                        type="button"
                        id="btn-font-decrease"
                        class="font-size-btn"
                        aria-label="Reducir tamaño de fuente"
                        title="Reducir tamaño de fuente"
                    >
                        A-
                    </button>
                    <button
                        type="button"
                        id="btn-font-reset"
                        class="font-size-indicator"
                        aria-label="Restablecer tamaño de fuente al 100%"
                        title="Restablecer tamaño (100%)"
                    >
                        100%
                    </button>
                    <button
                        type="button"
                        id="btn-font-increase"
                        class="font-size-btn"
                        aria-label="Aumentar tamaño de fuente"
                        title="Aumentar tamaño de fuente"
                    >
                        A+
                    </button>
                </div>
            </div>

            <div id="full-text" class="full-text"></div>

            <nav class="detail-navigation" aria-label="Navegación entre reflexiones">
                <a id="nav-prev" href="#" class="nav-post-link prev" hidden>
                    <span class="nav-label">← Anterior</span>
                    <span id="nav-prev-title" class="nav-title"></span>
                </a>

                <a href="index.html" class="btn-back">Inicio</a>

                <a id="nav-next" href="#" class="nav-post-link next" hidden>
                    <span class="nav-label">Siguiente →</span>
                    <span id="nav-next-title" class="nav-title"></span>
                </a>
            </nav>

            <div class="share-actions" aria-label="Acciones para compartir y marcar lectura">
                <button type="button" id="btn-copiar-cita" class="share-btn">
                    ❝ Copiar cita
                </button>
                <button type="button" id="btn-compartir" class="share-btn">
                    ✧ Compartir
                </button>
                <button
                    id="btn-marcar-leida"
                    type="button"
                    class="btn-lectura"
                    aria-pressed="false"
                >
                    Marcar como leída
                </button>
            </div>
        </article>
    </main>

    <script type="module" src="js/detalle.js"></script>

    <div id="toast-notificacion" class="toast-notificacion" role="status" aria-live="polite" hidden></div>
</body>
</html>
