<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reflexiones personales sobre filosofía de vida, crecimiento y libertad.">
    <title>Cénit Mental - Reflexión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Barra de progreso de lectura fija arriba -->
    <div class="progress-container">
        <div id="progress-indicator" class="progress-indicator"></div>
    </div>

    <main class="container">
        <article class="article-detail">
            <h1 id="title"></h1>
            <div class="article-meta">
                <span id="reading-time" class="reading-time" hidden></span>
            </div>
            <img id="image" src="" alt="" class="detail-img">
            <p id="quote" class="quote"></p>
            <p id="author" class="author"></p>
            <hr>
            <div id="full-text" class="full-text"></div>
        

            <nav class="detail-navigation" aria-label="Navegación entre reflexiones">
                <a id="nav-prev" href="#" class="nav-post-link prev" hidden>
                    <span class="nav-label">← Anterior</span>
                    <span id="nav-prev-title" class="nav-title"></span>
                </a>

                <a href="index.html" class="btn-back">Inicio</a>

                <a id="nav-next" href="#" class="nav-post-link next" hidden>
                    <span class="nav-label">Siguiente →</span>
                    <span id="nav-next-title" class="nav-title"></span>
                </a>
            </nav>

            <div class="share-actions" aria-label="Acciones para compartir">
                <div class="share-actions" aria-label="Acciones para compartir">
                <button type="button" id="btn-copiar-cita" class="share-btn">
                    ❝ Copiar cita
                </button>
                <button type="button" id="btn-compartir" class="share-btn">
                    ✧ Compartir
                </button>
            </div>
            </div>
        </article>
    </main>

    <!-- 1. Importamos tu fuente única de datos -->
    <script type="module" src="js/detalle.js"></script>

    <!-- 2. Buscamos la reflexión dinámicamente y activamos progreso + tiempo -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            // Buscamos el objeto cuyo id coincida con el parámetro de la URL
            const data = typeof reflexiones !== "undefined" 
                ? reflexiones.find(item => item.id === id) 
                : null;

            const fullTextEl = document.getElementById('full-text');
            const readingTimeEl = document.getElementById('reading-time');
            const progressIndicator = document.getElementById('progress-indicator');

            if (data) {
                document.title = `Cénit Mental - ${data.titulo}`;
                document.getElementById('title').textContent = data.titulo;
                
                const imgEl = document.getElementById('image');
                imgEl.src = data.imagen;
                imgEl.alt = data.titulo;
                
                document.getElementById('quote').textContent = `"${data.cita}"`;
                document.getElementById('author').textContent = data.autor || "";
                fullTextEl.innerHTML = data.texto;

                // Cálculo de tiempo estimado de lectura (200 palabras/min)
                const textoPlano = fullTextEl.innerText || "";
                const totalPalabras = textoPlano.trim().split(/\s+/).filter(Boolean).length;
                if (totalPalabras > 0 && readingTimeEl) {
                    const minutos = Math.ceil(totalPalabras / 200);
                    readingTimeEl.textContent = `${minutos} min de lectura`;
                    readingTimeEl.hidden = false;
                }
            } else {
                document.getElementById('title').textContent = "Reflexión no encontrada";
                document.getElementById('image').style.display = "none";
            }

            // Barra de progreso sincronizada con el scroll
            if (progressIndicator) {
                window.addEventListener("scroll", () => {
                    const scrollTop = window.scrollY || document.documentElement.scrollTop;
                    const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    
                    if (scrollHeight > 0) {
                        const porcentaje = Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100));
                        progressIndicator.style.width = `${porcentaje}%`;
                    } else {
                        progressIndicator.style.width = "100%";
                    }
                }, { passive: true });
            }
        });
    </script>

    <div id="toast-notificacion" class="toast-notificacion" role="status" aria-live="polite" hidden></div>
</body>
</html>
