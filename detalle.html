<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cénit Mental - Reflexión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <article class="article-detail">
            <h1 id="title"></h1>
            <img id="image" src="" alt="" class="detail-img">
            <p id="quote" class="quote"></p>
            <p id="author" class="author"></p>
            <hr>
            <div id="full-text" class="full-text"></div>
            <a href="index.html" class="btn-back">← Volver al inicio</a>
        </article>
    </main>

    <!-- 1. Importamos tu fuente única de datos -->
    <script src="datos.js"></script>

    <!-- 2. Buscamos la reflexión dinámicamente en el arreglo -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            // Buscamos el objeto cuyo id coincida con el parámetro de la URL
            const data = typeof reflexiones !== "undefined" 
                ? reflexiones.find(item => item.id === id) 
                : null;

            if (data) {
                document.title = `Cénit Mental - ${data.titulo}`;
                document.getElementById('title').textContent = data.titulo;
                
                const imgEl = document.getElementById('image');
                imgEl.src = data.imagen;
                imgEl.alt = data.titulo;
                
                document.getElementById('quote').textContent = `"${data.cita}"`;
                document.getElementById('author').textContent = data.autor || "";
                document.getElementById('full-text').innerHTML = data.texto;
            } else {
                document.getElementById('title').textContent = "Reflexión no encontrada";
                document.getElementById('image').style.display = "none";
            }
        });
    </script>
</body>
</html>
