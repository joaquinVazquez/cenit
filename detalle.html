<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cénit Mental - Reflexión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <article class="article-detail">
            <h1 id="title"></h1>
            <img id="image" src="" alt="" class="detail-img">
            <p id="quote" class="quote"></p>
            <p id="author" class="author"></p>
            <hr>
            <div id="full-text" class="full-text"></div>
            <a href="index.html" class="btn-back">← Volver al inicio</a>
        </article>
    </main>

    <script>
        // Base de datos local de tus reflexiones
        const reflexiones = {
            miedo: {
                titulo: "Miedo",
                imagen: "https://i.postimg.cc/MTGNXj8z/24-libertad.jpg",
                cita: '"Es toda una experiencia vivir con miedo, ¿verdad? Eso es lo que significa ser un esclavo"',
                autor: "Roy Batty",
                texto: "Reconocer que el miedo a menudo dicta las decisiones y crea una sensación de estancamiento a pesar de los esfuerzos constantes. El progreso real requiere auditar rutinas, identificar puntos ciegos, ajustar métodos y permitir un descanso suficiente en lugar de solo aumentar el volumen de esfuerzo. Tomar pequeñas acciones deliberadas sin buscar la aprobación externa para construir la autonomía paso a paso."
            },

            renovacion: {
                titulo: "Impermanencia y renovación",
                imagen: "https://i.postimg.cc/76LdbTyP/23-amanecer.jpg",
                cita: "No importa cuán oscura sea la noche, el día siempre vuelve a aparecer y nuestro viaje comienza una vez más.",
                autor: "Lulu",
                texto: `
                    <p>La <strong>noche</strong> representa las pruebas difíciles, la pérdida y la incertidumbre; el <strong>día</strong> simboliza la esperanza, el renacer y volver a empezar.</p>
                    
                    <p>La adversidad no es un final, sino un <em>preludio</em> que prepara el camino para la renovación. El estancamiento y los momentos difíciles son estrictamente temporales.</p>
                    
                    <p>Cada nuevo amanecer ofrece una <strong>oportunidad</strong> para aprender de los errores, reconstruir la fuerza interior y descubrir nuevos caminos a seguir.</p>
                `},

            eternosaprendices: {
                titulo: "Eternos aprendices: la plenitud en el presente",
                imagen: "https://i.postimg.cc/gkcPTHcY/25-eternos.jpg", 
                cita: "No importa cuánto crezcamos o cuánto envejezcamos, siempre estamos tropezando, haciéndonos preguntas eternamente jóvenes.",
                autor: "Alex Karev",
                texto: `
                    <p>Muchas veces nos autoexigimos un estado de madurez que debería darnos todas las respuestas. Buscamos un <strong>punto final</strong>, una meta invisible donde el esfuerzo termine y la seguridad sea absoluta. Sin embargo, por más que acumulemos años, siempre hay nuevos terrenos donde tropezamos como si fuera la primera vez, haciéndonos preguntas eternamente jóvenes.</p>
                    
                    <p>El crecimiento real no elimina nuestra vulnerabilidad; la transforma en <strong>curiosidad</strong>. Sentir dudas o equivocarse no son señales de fracaso, sino la prueba de que seguimos explorando. Cuando nos despojamos de la necesidad de parecer infalibles, recuperamos la <em>mente de principiante</em> y permitimos que la vida se mantenga en constante evolución.</p>
                    
                    <p>Esa sensación de no ser <strong>suficiente</strong> suele surgir al medir nuestro valor por metas externas e inalcanzables. Fortalecer la mente no es volverse de piedra, sino aprender a habitar la incertidumbre con asombro en lugar de miedo. La plenitud no es una recompensa lejana: está en el presente y en la capacidad de seguir aprendiendo.</p>
                    
                    <p>Ser eternos aprendices significa entender que la <strong>juventud de espíritu</strong> no se mide en el calendario, sino en la disposición para aprender y volver a empezar. Cada tropiezo nos recuerda que somos seres inacabados y en constante búsqueda.</p>
                `},

            elcomoyelcuando: {
                titulo: "El cómo y el cuándo",
                imagen: "https://i.postimg.cc/3wqLDzJc/26-como-cuando.jpg",
                cita: "Todos morimos. Lo que importa es el cómo y el cuándo.",
                autor: "William Wallace",
                texto: `
                    <p>La muerte es inevitable para todos, pero lo verdaderamente trascendente es la <strong>integridad</strong>, el valor y el propósito con el que decidimos vivir cada día. A menudo vivimos en piloto automático, preocupados por el futuro o anhelando el éxito, olvidando que lo único que realmente tenemos es el <em>presente</em>.</p>

                    <p>Esta reflexión encierra dos claves fundamentales:</p>
                    <ul>
                        <li><strong>El cómo:</strong> Nos invita a vivir con propósito, valentía y autenticidad. Es la brújula moral para definir quiénes queremos ser.</li>
                        <li><strong>El cuándo:</strong> Nos recuerda que no tenemos control sobre el tiempo, por lo que debemos aprovecharlo al máximo.</li>
                    </ul>

                    <p>La vida es efímera y cada día es una <strong>oportunidad única</strong>. La verdadera libertad no consiste en evitar el final o temer a la finitud, sino en imprimirle un <em>sello imborrable</em> a nuestro paso por el mundo.</p>

                    <p><strong>Vive con intensidad. Lucha por tus sueños. Haz que tu vida tenga el impacto que deseas, abrazando cada paso del viaje.</strong></p>
                `
            },

            lamento:{
               titulo: "Lamento",
                imagen: "https://i.postimg.cc/bNqLSt2g/27-lamento.jpg",
                cita: "Al final, solo lamentamos lo que no hemos hecho.",
                autor: "Taric",
                texto: `
                    <p>La clave está en el peso de la inacción o de las oportunidades que dejamos pasar por miedo, duda o inseguridad. Tarek nos enseña que la verdadera derrota no proviene de los errores cometidos, sino de la actitud y decisiones que tomamos durante el viaje.</p>

                    <p>El silencio de lo que callamos va erosionando nuestra autenticidad, mientras que el vacío de no intentar nos deja la duda perpetua de lo que pudo ser. La verdadera lamentación no proviene de las cosas intentadas y falladas, sino de las cosas no hechas y de los sueños no seguidos.</p>

                    <p>Debemos ser valientes al tomar decisiones, incluso en la incertidumbre. No permitas que el arrepentimiento se apodere de tu vida; atrévete a dar el paso hacia lo desconocido para romper la parálisis del análisis y vivir sin reservas.</p>
                ` 

            }
            
        };

        // Obtener el ID de la URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        // Renderizar el contenido si existe el id
        if (id && reflexiones[id]) {
            const data = reflexiones[id];
            document.getElementById('title').textContent = data.titulo;
            document.getElementById('image').src = data.imagen;
            document.getElementById('quote').textContent = data.cita;
            document.getElementById('author').textContent = data.autor;
            document.getElementById('full-text').innerHTML = data.texto;
        } else {
            document.getElementById('title').textContent = "Reflexión no encontrada";
        }
    </script>
</body>
</html>
