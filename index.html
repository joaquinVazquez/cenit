<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cénit Mental</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-titles">
            <h1>Cénit Mental</h1>
            <p>Liberación y Crecimiento</p>
        </div>
    </header>

    <!-- Contenedor del Post del Día (Skeleton inicial -> Se llena con JS) -->
    <section class="featured-post" id="featured-container">
        <div class="skeleton skeleton-badge"></div>
        <article class="featured-card">
            <div class="featured-image skeleton skeleton-img-featured"></div>
            <div class="featured-content">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text short"></div>
                <div class="skeleton skeleton-btn"></div>
            </div>
        </article>
    </section>

    <!-- Contenedor del Grid de Entradas Anteriores (Skeleton inicial -> Se llena con JS) -->
    <main class="grid-container" id="grid-container">
        <article class="card">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-img-card"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
        </article>
        <article class="card">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-img-card"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
        </article>
        <article class="card">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-img-card"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
        </article>
    </main>

    <footer>
        <div class="footer-logo">
            <img src="https://i.postimg.cc/JnhvtBCF/logo-jv.png" alt="Joaquin Vazquez Logo" class="footer-img">
        </div>
        <p>&copy; 2026 Cénit Mental. Reflexiones personales inspiradas en literatura y filosofías de vida.</p>
        <p class="credits">Desarrollado por Joaquín Vázquez</p>
    </footer>

    <!-- Carga de datos y script de automatización -->
    <script src="datos.js"></script>
    <script src="app.js"></script>
</body>
</html>
